name: Generate versioned site

on:
  push:
    branches: [ main ]
    paths:
      - 'index.template.html'
      - 'css/**.template.css'
      - 'js/**'
      - 'images/**'
      - 'README.md'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node (for possible scripts)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Ensure deploy script is executable
        run: chmod +x ./scripts/deploy_version.sh

      - name: Run deploy script
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: ./scripts/deploy_version.sh

      - name: Purge Cloudflare cache (optional)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN && secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          echo "Purging Cloudflare cache for zone ${{ secrets.CLOUDFLARE_ZONE_ID }}"
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | jq .
